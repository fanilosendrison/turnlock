name: node-pnpm

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-pnpm:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        node:
          - 22.19.0
          - 24.x

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.24.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install Bun failure sentinel
        shell: bash
        run: |
          sentinel="$RUNNER_TEMP/bun-failure-sentinel"
          mkdir -p "$sentinel"
          cat > "$sentinel/bun" <<'SENTINEL'
          #!/usr/bin/env sh
          echo "unexpected Bun invocation" >&2
          exit 97
          SENTINEL
          chmod +x "$sentinel/bun"
          echo "$sentinel" >> "$GITHUB_PATH"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate retired-runtime policy
        run: pnpm run test:policy

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Full test suite
        run: pnpm test

      - name: Validate published package surface
        run: pnpm run test:node-package

      - name: Build and inspect release tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
